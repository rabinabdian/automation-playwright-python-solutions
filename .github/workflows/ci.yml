name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run smoke tests
        run: pytest -m smoke --browser=chromium -n auto --tb=short
        continue-on-error: false

      - name: Run E2E tests
        run: pytest tests/e2e/ --browser=chromium -n auto --tb=short
        continue-on-error: true

      - name: Run API tests
        run: pytest tests/api/ -v --tb=short
        continue-on-error: true

      - name: Run data-driven tests
        run: pytest tests/data_driven/ --browser=chromium -n auto --tb=short
        continue-on-error: true

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
